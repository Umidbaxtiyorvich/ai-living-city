# Free Render instances sleep after 15 minutes without traffic, which would
# stop the civilization. This pings the site every 10 minutes to keep it awake.
# Set the repository variable RENDER_URL (Settings → Variables) to the site URL.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the site
        env:
          URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$URL" ]; then echo "RENDER_URL is not set"; exit 0; fi
          curl -fsS --max-time 60 --retry 3 --retry-delay 10 "$URL/api/health" || true
