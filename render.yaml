# Render.com — free web service. The world is kept in a free Postgres
# (e.g. Neon): set CIV_DATABASE_URL in the dashboard. Free instances sleep
# after 15 idle minutes; .github/workflows/keepalive.yml pings the site.
services:
  - type: web
    name: ai-living-city
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: WORLD_MODE
        value: civ
      - key: DEFAULT_SPEED
        value: "1"
      - key: CIV_SAVE_EVERY
        value: "1800"
      - key: CIV_DATABASE_URL
        sync: false
